[package]
name = "cipd"
version = "0.1.0"
edition = "2021"
description = "Clean-room Debian daemon: EtherNet/IP + CSPv4 + DF1 transports feeding a unified CIP/PCCC router"
license = "MIT OR Apache-2.0"

[[bin]]
name = "cipd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-serial = "5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
